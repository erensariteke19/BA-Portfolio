<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sipariş iptal ekranı wireframe</title>
  <desc id="desc">Sipariş detay sayfası ve iptal onay modalının düşük çözünürlüklü taslağı.</desc>
  <rect width="1200" height="760" fill="#f5f7fa"/>
  <rect x="60" y="45" width="1080" height="670" rx="14" fill="#ffffff" stroke="#9aa6b2" stroke-width="2"/>
  <text x="100" y="100" font-family="Arial" font-size="28" font-weight="700" fill="#172b4d">Sipariş Detayı</text>
  <text x="100" y="137" font-family="Arial" font-size="17" fill="#5e6c84">Sipariş #ES-10428 · 20 Haziran 2026</text>
  <rect x="920" y="88" width="150" height="38" rx="19" fill="#e3fcef" stroke="#36b37e"/>
  <text x="995" y="113" text-anchor="middle" font-family="Arial" font-size="16" fill="#006644">Processing</text>
  <line x1="100" y1="165" x2="1100" y2="165" stroke="#dfe1e6" stroke-width="2"/>
  <rect x="100" y="200" width="90" height="90" fill="#ebecf0" stroke="#a5adba"/>
  <text x="145" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#5e6c84">Ürün</text>
  <text x="220" y="225" font-family="Arial" font-size="19" font-weight="700" fill="#172b4d">Kablosuz Kulaklık</text>
  <text x="220" y="260" font-family="Arial" font-size="16" fill="#5e6c84">Adet: 1</text>
  <text x="1040" y="245" text-anchor="end" font-family="Arial" font-size="19" font-weight="700" fill="#172b4d">1.299 TL</text>
  <line x1="100" y1="320" x2="1100" y2="320" stroke="#dfe1e6"/>
  <text x="100" y="365" font-family="Arial" font-size="18" fill="#172b4d">Ödeme durumu</text>
  <text x="1040" y="365" text-anchor="end" font-family="Arial" font-size="18" fill="#172b4d">Ödendi</text>
  <text x="100" y="405" font-family="Arial" font-size="18" fill="#172b4d">Toplam</text>
  <text x="1040" y="405" text-anchor="end" font-family="Arial" font-size="22" font-weight="700" fill="#172b4d">1.299 TL</text>
  <rect x="870" y="640" width="200" height="48" rx="6" fill="#de350b"/>
  <text x="970" y="670" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#ffffff">Siparişi İptal Et</text>
  <rect x="300" y="165" width="600" height="440" rx="12" fill="#ffffff" stroke="#42526e" stroke-width="3"/>
  <text x="345" y="220" font-family="Arial" font-size="25" font-weight="700" fill="#172b4d">Siparişi iptal etmek istiyor musunuz?</text>
  <text x="345" y="260" font-family="Arial" font-size="16" fill="#5e6c84">İptal sonrası ürünler stoğa geri eklenecek ve iade süreci başlatılacaktır.</text>
  <text x="345" y="315" font-family="Arial" font-size="16" font-weight="700" fill="#172b4d">İptal nedeni (opsiyonel)</text>
  <rect x="345" y="335" width="510" height="55" rx="5" fill="#ffffff" stroke="#7a869a" stroke-width="2"/>
  <text x="365" y="370" font-family="Arial" font-size="16" fill="#7a869a">Bir neden seçin</text>
  <text x="345" y="430" font-family="Arial" font-size="16" font-weight="700" fill="#172b4d">Açıklama (opsiyonel)</text>
  <rect x="345" y="450" width="510" height="80" rx="5" fill="#ffffff" stroke="#7a869a" stroke-width="2"/>
  <text x="365" y="480" font-family="Arial" font-size="15" fill="#7a869a">En fazla 500 karakter</text>
  <rect x="575" y="550" width="125" height="40" rx="5" fill="#ffffff" stroke="#5e6c84"/>
  <text x="638" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="#172b4d">Vazgeç</text>
  <rect x="715" y="550" width="140" height="40" rx="5" fill="#de350b"/>
  <text x="785" y="576" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">İptali Onayla</text>
