<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Admin ürün görseli yöneticisi</title><desc id="d">Beş görsel limiti, kapak seçimi, yükleme ve hata durumlarını gösteren wireframe.</desc>
  <rect width="1200" height="760" fill="#f4f5f7"/><rect x="45" y="35" width="1110" height="690" rx="12" fill="#fff" stroke="#9aa6b2" stroke-width="2"/>
  <text x="85" y="92" font-family="Arial" font-size="28" font-weight="700" fill="#172b4d">Ürün Görselleri</text><text x="85" y="127" font-family="Arial" font-size="16" fill="#5e6c84">JPG, PNG veya WEBP · En fazla 2 MB · Ürün başına 5 görsel</text>
  <rect x="85" y="165" width="1030" height="120" rx="9" fill="#fafbfc" stroke="#7a869a" stroke-width="2" stroke-dasharray="8 6"/><text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#172b4d">Görselleri buraya sürükleyin</text><text x="600" y="250" text-anchor="middle" font-family="Arial" font-size="15" fill="#5e6c84">veya dosya seçin</text>
  <text x="85" y="335" font-family="Arial" font-size="18" font-weight="700" fill="#172b4d">Yüklenen görseller <tspan font-weight="400" fill="#5e6c84">3 / 5</tspan></text>
  <rect x="85" y="365" width="290" height="220" rx="8" fill="#ebecf0" stroke="#0052cc" stroke-width="3"/><text x="230" y="460" text-anchor="middle" font-family="Arial" font-size="16" fill="#5e6c84">Görsel 1</text><rect x="105" y="530" width="110" height="32" rx="16" fill="#deebff"/><text x="160" y="552" text-anchor="middle" font-family="Arial" font-size="14" fill="#0747a6">Kapak</text><text x="340" y="552" text-anchor="end" font-family="Arial" font-size="14" fill="#de350b">Sil</text>
  <rect x="395" y="365" width="290" height="220" rx="8" fill="#ebecf0" stroke="#a5adba"/><text x="540" y="460" text-anchor="middle" font-family="Arial" font-size="16" fill="#5e6c84">Görsel 2</text><text x="420" y="552" font-family="Arial" font-size="14" fill="#0052cc">Kapak yap</text><text x="650" y="552" text-anchor="end" font-family="Arial" font-size="14" fill="#de350b">Sil</text>
  <rect x="705" y="365" width="290" height="220" rx="8" fill="#ebecf0" stroke="#a5adba"/><text x="850" y="460" text-anchor="middle" font-family="Arial" font-size="16" fill="#5e6c84">Görsel 3</text><text x="730" y="552" font-family="Arial" font-size="14" fill="#0052cc">Kapak yap</text><text x="960" y="552" text-anchor="end" font-family="Arial" font-size="14" fill="#de350b">Sil</text>
  <rect x="895" y="640" width="220" height="52" rx="7" fill="#0052cc"/><text x="1005" y="673" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">Değişiklikleri Kaydet</text>
</svg>
