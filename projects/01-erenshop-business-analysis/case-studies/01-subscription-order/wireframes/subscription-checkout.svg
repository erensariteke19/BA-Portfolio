<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Abonelik oluşturma ekranı</title><desc id="d">Ürün, teslimat sıklığı, sonraki tarih ve ödeme özetini gösteren wireframe.</desc>
  <rect width="1200" height="760" fill="#f5f7fa"/><rect x="55" y="40" width="1090" height="680" rx="14" fill="#fff" stroke="#9aa6b2" stroke-width="2"/>
  <text x="95" y="95" font-family="Arial" font-size="28" font-weight="700" fill="#172b4d">Düzenli Teslimat Oluştur</text>
  <text x="95" y="130" font-family="Arial" font-size="16" fill="#5e6c84">Ürününüz belirlediğiniz aralıklarla otomatik sipariş edilir.</text>
  <rect x="95" y="175" width="110" height="110" fill="#ebecf0" stroke="#a5adba"/><text x="150" y="235" text-anchor="middle" font-family="Arial" font-size="14" fill="#5e6c84">Ürün</text>
  <text x="235" y="205" font-family="Arial" font-size="21" font-weight="700" fill="#172b4d">Günlük Bakım Paketi</text><text x="235" y="245" font-family="Arial" font-size="17" fill="#5e6c84">349 TL / teslimat</text>
  <text x="95" y="345" font-family="Arial" font-size="17" font-weight="700" fill="#172b4d">Teslimat sıklığı</text>
  <rect x="95" y="365" width="185" height="55" rx="7" fill="#deebff" stroke="#0052cc" stroke-width="2"/><text x="187" y="399" text-anchor="middle" font-family="Arial" font-size="17" fill="#0747a6">Her ay</text>
  <rect x="295" y="365" width="185" height="55" rx="7" fill="#fff" stroke="#7a869a"/><text x="387" y="399" text-anchor="middle" font-family="Arial" font-size="17" fill="#172b4d">2 ayda bir</text>
  <rect x="495" y="365" width="185" height="55" rx="7" fill="#fff" stroke="#7a869a"/><text x="587" y="399" text-anchor="middle" font-family="Arial" font-size="17" fill="#172b4d">3 ayda bir</text>
  <text x="95" y="480" font-family="Arial" font-size="17" font-weight="700" fill="#172b4d">Ödeme yöntemi</text><rect x="95" y="500" width="585" height="60" rx="7" fill="#fff" stroke="#7a869a"/><text x="120" y="537" font-family="Arial" font-size="16" fill="#172b4d">•••• 4242 · Son kullanma 08/28</text>
  <rect x="760" y="175" width="330" height="385" rx="10" fill="#fafbfc" stroke="#dfe1e6"/><text x="800" y="220" font-family="Arial" font-size="20" font-weight="700" fill="#172b4d">Abonelik özeti</text>
  <text x="800" y="275" font-family="Arial" font-size="16" fill="#5e6c84">Sıklık</text><text x="1050" y="275" text-anchor="end" font-family="Arial" font-size="16" fill="#172b4d">Her ay</text>
  <text x="800" y="320" font-family="Arial" font-size="16" fill="#5e6c84">İlk teslimat</text><text x="1050" y="320" text-anchor="end" font-family="Arial" font-size="16" fill="#172b4d">15 Ağustos</text>
  <text x="800" y="365" font-family="Arial" font-size="16" fill="#5e6c84">Sonraki ödeme</text><text x="1050" y="365" text-anchor="end" font-family="Arial" font-size="16" fill="#172b4d">15 Eylül</text>
  <line x1="800" y1="405" x2="1050" y2="405" stroke="#dfe1e6"/><text x="800" y="450" font-family="Arial" font-size="18" font-weight="700" fill="#172b4d">Tutar</text><text x="1050" y="450" text-anchor="end" font-family="Arial" font-size="20" font-weight="700" fill="#172b4d">349 TL</text>
  <rect x="760" y="600" width="330" height="55" rx="7" fill="#0052cc"/><text x="925" y="635" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Aboneliği Başlat</text>
</svg>
